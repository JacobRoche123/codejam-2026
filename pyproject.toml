[project]
name = "thinkless"
version = "0.1.0"
description = "Avant de réfléchir, il demande : ThinkLess choisit le plus petit modèle Claude suffisant."
authors = [
    { name = "Jacob Roche", email = "358796410+JacobRoche123@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
thinkless = "thinkless:main"
thinkless-mcp = "thinkless.mcp_server:main"
thinkless-hook = "thinkless.hook:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
